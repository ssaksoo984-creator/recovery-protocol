<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RECOVERY PROTOCOL — Soomin Park</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Howler.js : 효과음/배경음악 재생 라이브러리 (CDN) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<style>
:root{
  --void:#04070d; --ink:#0a121e; --panel:#0e1826;
  --cyan:#4fe3e0; --cyan-deep:#1c6f76; --cyan-glow:rgba(79,227,224,.55);
  --amber:#e8a03c; --ember:#ff6b2c;
  --paper:#ede7d8; --fog:#8fa3b8; --fog-dim:#54677d;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100svh;height:100dvh;background:#000;overflow:hidden;
  font-family:var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- stage : 모든 좌표의 기준 ----------
   모바일은 주소창이 보였다 숨었다 하면서 100vh가 실제 화면보다 커짐 → 상단이 화면 밖으로 밀림.
   svh(주소창이 항상 떠 있다고 가정하는 가장 작은 값)를 우선 폴백으로 깔고,
   dvh(주소창 상태에 맞춰 실시간으로 바뀌는 값)를 그 위에 얹어서 — 잘리진 않으면서도
   주소창이 사라지면 화면도 같이 커지게 함 */
#stage{position:relative;width:100vw;height:56.25vw;
  max-height:100vh;max-height:100svh;max-height:100dvh;
  max-width:177.78vh;max-width:177.78svh;max-width:177.78dvh;
  overflow:hidden;background:var(--void);user-select:none}
#stage:fullscreen{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .9s ease,visibility .9s}
.scene.on{opacity:1;visibility:visible}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:95}
#hud .corner{position:absolute;width:26px;height:26px;border:1px solid rgba(79,227,224,.32)}
#hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
#hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
#hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
#hud .br{bottom:14px;right:14px;border-left:0;border-top:0}
#hud .scan{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 2px 3px)}
#hud .vig{position:absolute;inset:0;box-shadow:inset 0 0 min(18vw,220px) rgba(0,0,0,.8)}

#topbar{position:absolute;top:0;left:0;right:0;z-index:96;
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(12px,1.8vw,26px) clamp(16px,2.4vw,34px);gap:12px}
.tag{font-family:var(--mono);font-size:clamp(9px,.78vw,12px);letter-spacing:.22em;
  color:var(--cyan-deep);text-transform:uppercase}
.tools{display:flex;gap:8px}
.tbtn{font-family:var(--mono);font-size:clamp(9px,.78vw,12px);letter-spacing:.14em;
  color:var(--fog-dim);border:1px solid rgba(143,163,184,.24);
  padding:.45em .85em;border-radius:2px;transition:.25s;backdrop-filter:blur(3px)}
.tbtn:hover,.tbtn:focus-visible{color:var(--cyan);border-color:var(--cyan-deep);outline:none}
.tbtn[aria-pressed="true"]{color:var(--cyan);border-color:var(--cyan-deep)}

/* ---------- 공통 버튼 ---------- */
.cta{font-family:var(--mono);font-size:clamp(11px,1.05vw,15px);letter-spacing:.18em;
  text-transform:uppercase;color:var(--cyan);
  border:1px solid var(--cyan-deep);background:rgba(8,20,28,.5);
  padding:.9em 2.2em;border-radius:2px;position:relative;transition:.3s;backdrop-filter:blur(4px)}
.cta:hover,.cta:focus-visible{background:rgba(79,227,224,.12);
  box-shadow:0 0 26px rgba(79,227,224,.22);outline:none}
.cta:disabled{opacity:.28;cursor:not-allowed;box-shadow:none;background:none}

/* ---------- 00 boot ---------- */
#boot{display:grid;place-items:center;background:var(--void);z-index:90}
#boot .inner{position:relative;z-index:2;text-align:center;padding:0 6vw;max-width:900px}

#boot .bg{filter:brightness(.88) saturate(.95);transform:scale(1.05);
  animation:drift 30s ease-in-out infinite alternate}
#boot .grade{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 32%,rgba(4,7,13,.2),rgba(4,7,13,.6) 72%),
             linear-gradient(to top,rgba(4,7,13,.78) 0%,rgba(4,7,13,.1) 55%)}

/* smoke : 폐허 위로 짙게 솟아오르는 연기 (잉걸불 톤 + 그을음) */
.smoke-layer{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.smoke{position:absolute;bottom:-22%;border-radius:48% 52% 45% 55%/55% 48% 52% 45%;
  background:radial-gradient(circle at 50% 68%,rgba(255,140,60,.22),rgba(28,25,23,.8) 32%,rgba(8,7,7,.6) 60%,transparent 78%);
  filter:blur(1.3vw);opacity:0;animation:smokeRise linear infinite}
.smoke.s1{width:26vw;height:36vw;left:2%;animation-duration:11s}
.smoke.s2{width:19vw;height:28vw;left:32%;animation-duration:14s;animation-delay:-2s}
.smoke.s3{width:32vw;height:44vw;left:56%;animation-duration:16s;animation-delay:-4s}
.smoke.s4{width:17vw;height:24vw;left:78%;animation-duration:9.5s;animation-delay:-1s}
@keyframes smokeRise{
  0%{transform:translateY(0) translateX(0) scale(.5) rotate(0deg);opacity:0}
  10%{opacity:.78}
  40%{transform:translateY(-30vh) translateX(2vw) scale(1.05) rotate(4deg);opacity:.62}
  75%{transform:translateY(-60vh) translateX(-2.5vw) scale(1.55) rotate(-3deg);opacity:.28}
  100%{transform:translateY(-95vh) translateX(1vw) scale(1.95) rotate(2deg);opacity:0}
}

#boot h1{position:relative;font-family:var(--mono);font-weight:600;
  font-size:clamp(26px,5vw,72px);letter-spacing:.16em;color:var(--paper);line-height:1.05}
#boot h1 em{font-style:normal;color:var(--ember)}
/* glitch : 메인 타이틀에 주기적으로 짧게 튀는 RGB 분리 효과 */
#boot h1.glitch::before,#boot h1.glitch::after{
  content:attr(data-text);position:absolute;inset:0;pointer-events:none}
#boot h1.glitch::before{color:#ff2b52;clip-path:inset(0 0 100% 0);
  animation:glitchTop 1.3s infinite linear}
#boot h1.glitch::after{color:#4fe3e0;clip-path:inset(100% 0 0 0);
  animation:glitchBot 1.3s infinite linear}
#boot h1.glitch{animation:titleShake 1.3s infinite linear}
@keyframes glitchTop{
  0%,8%,46%,54%,100%{clip-path:inset(0 0 100% 0);transform:translate(0,0)}
  2%{clip-path:inset(10% 0 55% 0);transform:translate(-5px,-2px)}
  4%{clip-path:inset(45% 0 15% 0);transform:translate(5px,2px)}
  6%{clip-path:inset(70% 0 5% 0);transform:translate(-4px,1px)}
  48%{clip-path:inset(20% 0 50% 0);transform:translate(4px,-2px)}
  51%{clip-path:inset(60% 0 10% 0);transform:translate(-5px,2px)}
}
@keyframes glitchBot{
  0%,20%,68%,76%,100%{clip-path:inset(100% 0 0 0);transform:translate(0,0)}
  22%{clip-path:inset(55% 0 15% 0);transform:translate(5px,2px)}
  24%{clip-path:inset(25% 0 50% 0);transform:translate(-5px,-1px)}
  26%{clip-path:inset(5% 0 75% 0);transform:translate(4px,-2px)}
  70%{clip-path:inset(50% 0 20% 0);transform:translate(-4px,2px)}
  73%{clip-path:inset(15% 0 60% 0);transform:translate(5px,-1px)}
}
@keyframes titleShake{
  0%,7%,21%,47%,55%,69%,77%,100%{transform:translate(0,0)}
  2%{transform:translate(-2px,1px)}
  4%{transform:translate(2px,-1px)}
  23%{transform:translate(2px,1px)}
  25%{transform:translate(-2px,-1px)}
  49%{transform:translate(-1px,-1px)}
  71%{transform:translate(1px,1px)}
}
#boot .sub{margin-top:1.4em;font-size:clamp(12px,1.25vw,17px);color:var(--fog);line-height:1.9}
#boot .meta{margin-top:.9em;font-family:var(--mono);font-size:clamp(9px,.8vw,12px);
  letter-spacing:.2em;color:var(--fog-dim)}
#boot .cta{margin-top:2.6em}
#boot .load{margin-top:1.8em;font-family:var(--mono);font-size:clamp(9px,.8vw,12px);
  letter-spacing:.16em;color:var(--cyan-deep);height:1.2em}

/* ---------- 01 future ---------- */
#future .bg{transform:scale(1.06);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.13) translate(-1.4%,-1%)}}
#future .grade{position:absolute;inset:0;
  background:radial-gradient(ellipse at 68% 34%,rgba(255,107,44,.18),transparent 58%),
             linear-gradient(to top,rgba(4,7,13,.94) 4%,rgba(4,7,13,.15) 46%)}
.shock{position:absolute;inset:0;background:rgba(255,150,80,.5);opacity:0;pointer-events:none}
.shock.hit{animation:shock .5s ease-out}
@keyframes shock{0%{opacity:.55}100%{opacity:0}}

#explodeVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:26;display:none;background:#000}

.char{position:absolute;left:1.5%;bottom:0;height:78%;
  filter:drop-shadow(0 0 34px rgba(79,227,224,.16));
  opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.char.on{opacity:1;transform:translateY(0)}

.dbox{position:absolute;left:36%;right:5%;bottom:8%;z-index:20;
  border-left:2px solid var(--cyan-deep);padding:clamp(10px,1.4vw,20px) clamp(14px,1.8vw,26px);
  background:linear-gradient(90deg,rgba(6,12,20,.9),rgba(6,12,20,.42));
  backdrop-filter:blur(6px)}
.dname{font-family:var(--mono);font-size:clamp(9px,.8vw,12px);letter-spacing:.24em;
  color:var(--cyan);text-transform:uppercase;margin-bottom:.7em}
.dtext{font-size:clamp(13px,1.5vw,22px);line-height:1.75;color:var(--paper);
  min-height:3.5em;word-break:keep-all}
.dnext{position:absolute;right:clamp(14px,1.8vw,26px);bottom:clamp(8px,1.1vw,16px);
  font-family:var(--mono);font-size:clamp(9px,.8vw,12px);color:var(--cyan);
  letter-spacing:.14em;animation:blink 1.3s steps(2) infinite;opacity:0}
.dnext.on{opacity:1}
@keyframes blink{50%{opacity:.18}}
#future .clickpad{position:absolute;inset:0;z-index:15;cursor:pointer}

/* ---------- 02 portal / travel ---------- */
#portal{background:#000;z-index:80}
#portal canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.ring{position:absolute;top:50%;left:50%;width:12vmin;height:12vmin;z-index:3;
  transform:translate(-50%,-50%) scale(.1);border-radius:50%;
  background:conic-gradient(from 0deg,transparent,#f2f4f6,#4b5158,transparent 70%);
  filter:blur(6px);opacity:0}
.ring.go{animation:ringgo 2.4s cubic-bezier(.6,0,.35,1) forwards}
@keyframes ringgo{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(0)}
  25%{opacity:1}
  100%{opacity:1;transform:translate(-50%,-50%) scale(26) rotate(900deg)}}
.flash{position:absolute;inset:0;background:#eef1f4;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:fl .8s ease-out forwards}
@keyframes fl{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
#travelVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}

/* ---------- 03 office ---------- */
#office .bg{filter:brightness(1.5) saturate(.9)}
.veil{position:absolute;inset:0;background:rgba(2,5,11,.965);
  -webkit-mask-image:radial-gradient(circle var(--r,180px) at var(--x,50%) var(--y,50%),
    transparent 0%,transparent 46%,rgba(0,0,0,.6) 72%,#000 100%);
  mask-image:radial-gradient(circle var(--r,180px) at var(--x,50%) var(--y,50%),
    transparent 0%,transparent 46%,rgba(0,0,0,.6) 72%,#000 100%)}
.beam{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle var(--r,180px) at var(--x,50%) var(--y,50%),
    rgba(255,216,158,.3) 0%,rgba(255,186,110,.13) 48%,transparent 74%)}
#hand{position:absolute;width:16%;bottom:-2%;left:0;pointer-events:none;z-index:30;
  transform-origin:60% 100%;transition:transform .18s ease-out;
  filter:drop-shadow(0 0 22px rgba(255,200,140,.3))}
.spot{position:absolute;z-index:25;border:1px solid transparent;border-radius:3px;
  transition:.35s;pointer-events:none;cursor:pointer}
.spot.lit{border-color:rgba(255,206,140,.5);
  box-shadow:0 0 0 1px rgba(255,206,140,.14),inset 0 0 40px rgba(255,206,140,.1);
  pointer-events:auto}
.spot.done{border-color:rgba(79,227,224,.55);box-shadow:inset 0 0 40px rgba(79,227,224,.1)}
.spot .lbl{position:absolute;left:50%;bottom:-2.3em;transform:translateX(-50%);
  font-family:var(--mono);font-size:clamp(9px,.82vw,13px);letter-spacing:.14em;
  color:var(--amber);white-space:nowrap;opacity:0;transition:.3s;text-shadow:0 2px 12px #000}
.spot.lit .lbl{opacity:1}
.spot.done .lbl{color:var(--cyan)}
#office .clickpad{position:absolute;inset:0;z-index:20;cursor:crosshair}
.narr{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:40;
  text-align:center;font-size:clamp(12px,1.35vw,19px);color:var(--paper);
  text-shadow:0 2px 20px #000;line-height:1.8;pointer-events:none;
  opacity:0;transition:opacity .8s;width:86%;word-break:keep-all}
.narr.on{opacity:1}
#progress{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:45;
  display:flex;flex-direction:column;align-items:center;gap:1.1em}
.pips{display:flex;gap:.9em}
.pip{width:clamp(26px,3vw,44px);height:2px;background:rgba(143,163,184,.28);transition:.4s}
.pip.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan-glow)}
#unlockBtn{opacity:0;visibility:hidden;transition:.6s}
#unlockBtn.on{opacity:1;visibility:visible}

/* ---------- viewer ---------- */
#viewer{position:absolute;inset:0;z-index:100;display:none;
  background:rgba(2,4,9,.9);backdrop-filter:blur(8px)}
#viewer.on{display:grid;place-items:center;animation:vin .4s ease}
@keyframes vin{from{opacity:0}}
.sheet{position:relative;width:min(78%,780px);max-height:82%;overflow:auto;
  background:var(--paper);color:#1d2530;padding:clamp(20px,3vw,46px);
  box-shadow:0 30px 80px rgba(0,0,0,.7);border-radius:2px}
.sheet::-webkit-scrollbar{width:6px}
.sheet::-webkit-scrollbar-thumb{background:#b9b2a2}
.sheet h2{font-family:var(--mono);font-size:clamp(15px,1.7vw,24px);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:.2em}
.sheet .rule{height:1px;background:#c3bcab;margin:1.2em 0}
.sheet p{font-size:clamp(12px,1.15vw,16px);line-height:1.95;margin-bottom:1em;word-break:keep-all}
.sheet .kv{display:flex;gap:1.4em;font-size:clamp(11px,1.05vw,15px);
  padding:.55em 0;border-bottom:1px solid #ddd5c4}
.sheet .kv b{flex:0 0 clamp(70px,8vw,120px);font-weight:500;color:#6a6455;
  font-family:var(--mono);font-size:.86em;letter-spacing:.08em}
.rtabs{display:flex;gap:.4em;margin-top:1.1em}
.rtab{font-family:var(--mono);font-size:clamp(10px,.95vw,13px);letter-spacing:.1em;
  text-transform:uppercase;color:#8a8374;background:none;border:1px solid #c9c1b0;
  padding:.55em 1.1em;border-radius:2px;transition:.2s;cursor:pointer}
.rtab:hover{color:#1d2530}
.rtab.on{color:#1d2530;background:#e4dcc9;border-color:#9d9484}
.rrole{font-size:clamp(13px,1.3vw,17px);font-weight:600}
.rmeta{font-family:var(--mono);font-size:clamp(10px,1vw,13px);color:#6a6455;
  margin-top:.4em;line-height:1.8}
.job{margin-bottom:1.6em}
.job:last-child{margin-bottom:0}
.jhead{display:flex;justify-content:space-between;align-items:baseline;gap:1em;flex-wrap:wrap}
.jtitle{font-size:clamp(12.5px,1.2vw,15.5px);font-weight:600}
.jdate{font-family:var(--mono);font-size:clamp(9.5px,.92vw,12px);color:#8a8374;white-space:nowrap}
.jorg{font-size:clamp(11px,1.05vw,13.5px);color:#6a6455;margin:.25em 0 .75em;
  font-style:italic;line-height:1.6}
.sheet ul{list-style:none}
.sheet li{position:relative;padding-left:1.1em;font-size:clamp(11.5px,1.1vw,14.5px);
  line-height:1.9;margin-bottom:.65em;word-break:keep-all}
.sheet li::before{content:'–';position:absolute;left:0;color:#8a8374}
.sheet li b{font-weight:600}
.fsubtitle{font-family:var(--mono);font-size:clamp(10px,1vw,13px);color:#6a6455;
  letter-spacing:.04em;margin-top:.3em}
.fsec{margin-bottom:1.8em}
.fsec:last-child{margin-bottom:0}
.fsec h3{font-family:var(--mono);font-size:clamp(11px,1.05vw,14px);font-weight:600;
  letter-spacing:.05em;color:#1d2530;margin-bottom:.7em;
  padding-bottom:.4em;border-bottom:1px solid #ddd5c4}
.fsec p{margin-bottom:.9em}
.fsec p:last-child{margin-bottom:0}
.mark{background:linear-gradient(transparent 58%,rgba(255,107,44,.42) 58%);
  font-weight:600;padding:0 .12em}
.stamp{position:absolute;top:clamp(16px,2.4vw,34px);right:clamp(16px,2.4vw,34px);
  font-family:var(--mono);font-size:clamp(10px,1vw,14px);letter-spacing:.18em;
  color:#9d1f0d;border:1.5px solid #9d1f0d;padding:.35em .7em;transform:rotate(6deg);opacity:.72}
.vclose{position:absolute;top:3.5%;right:4%;font-family:var(--mono);letter-spacing:.14em;
  font-size:clamp(10px,.95vw,14px);color:var(--fog);border:1px solid rgba(143,163,184,.3);
  padding:.5em 1em;transition:.25s}
.vclose:hover{color:var(--cyan);border-color:var(--cyan-deep)}
.logo{display:flex;align-items:baseline;gap:.1em;font-family:var(--mono);
  font-size:clamp(24px,3.6vw,52px);font-weight:600;letter-spacing:-.02em}
.logo .a{color:#1d2530}.logo .b{color:#9d9484}
.linkrow{display:flex;gap:.8em;flex-wrap:wrap;margin-top:1.6em}
.link{font-family:var(--mono);font-size:clamp(10px,1vw,14px);letter-spacing:.12em;
  text-transform:uppercase;border:1px solid #1d2530;padding:.7em 1.4em;
  color:#1d2530;text-decoration:none;transition:.25s;display:inline-block}
.link:hover{background:#1d2530;color:var(--paper)}

/* ---------- 04 terminal ---------- */
#terminal .bg{filter:brightness(.6) saturate(.75)}
#terminal .grade{position:absolute;inset:0;background:rgba(4,7,13,.42)}
#deviceLayer{position:absolute;inset:0;z-index:20;
  transition:opacity 1.1s ease,transform 1.1s ease}
#deviceLayer.off{opacity:0;transform:scale(.965)}
#computerImg{position:absolute;display:none;pointer-events:none;object-fit:contain;
  filter:drop-shadow(0 26px 70px rgba(0,0,0,.75))}
.monitor{position:absolute;left:24%;top:19%;width:52%;height:60%;
  background:#14181c;border-radius:clamp(6px,.9vw,14px);
  padding:clamp(9px,1.15vw,18px) clamp(9px,1.15vw,18px) clamp(20px,2.6vw,40px);
  box-shadow:0 0 0 2px #292f36,0 26px 70px rgba(0,0,0,.8),0 0 90px rgba(79,227,224,.1)}
/* 실제 컴퓨터 이미지를 쓸 때 : 껍데기를 벗고 화면 영역만 남김 */
.monitor.bare{background:transparent;box-shadow:none;padding:0;border-radius:0}
.monitor.bare::after{display:none}
.monitor.bare .screen{background:rgba(3,9,11,.62);box-shadow:inset 0 0 10cqw rgba(79,227,224,.12)}

  sections:[
   {h:'0. 나라는 사람', body:[
     '저는 디자이너이자 배우이고, 글을 쓰고 연출도 합니다. 얼핏 다른 일처럼 보이지만, 이 모든 역할에는 하나의 공통점이 있습니다 — 공감하고, 표현하고, 연결하는 것. 무대 위에서 인물의 감정을 이해하려는 태도와, 화면 앞에서 사용자가 무엇을 원하는지 파악하려는 태도는 저에게 다르지 않았습니다.',
     '이 태도는 다양한 형태의 조직을 거치며 더 단단해졌습니다. 스타트업, 광고 에이전시, 프리랜서, 공공기관 프로젝트까지 — 각 조직이 요구하는 것은 저마다 달랐습니다. 속도를 우선하는 곳이 있는가 하면 매뉴얼과 문서화를 철저히 따라야 하는 곳도 있었고, 기업을 위한 시스템인지 소비자를 위한 시스템인지, 시선을 사로잡아야 하는 홍보물인지 안정감을 줘야 하는 정적인 화면인지에 따라 디자인의 기준 자체가 달라졌습니다. 새로운 곳에 가더라도 그 조직이 어떤 방식으로 일하는지를 빠르게 파악하고 적응하는 감각은, 결국 매번 다른 사람들에게 공감하려는 습관에서 왔다고 생각합니다.'
   ]},
   {h:'1. 공공기관 — 방대한 자료를 한눈에', body:[
     '국립박물관문화재단의 온라인 굿즈샵 \'뮷즈\'와 국립민속박물관 대표 누리집, 두 프로젝트 모두 같은 질문에서 출발했습니다. 방대하고 산발적인 자료를 어떻게 하면 사람들이 한눈에 파악하고, 원하는 곳에 더 빨리 닿게 만들 수 있을까.',
     '뮷즈에서는 사람들이 실제로 가장 많이 접근하는 상품, 이탈이 발생하는 지점, CS로 접수되는 오류를 먼저 확인했습니다. 문제는 기능이 없는 것이 아니라, 있는 기능을 사용자가 찾지 못하는 데 있는 경우가 많았습니다. 그렇게 파악된 이용 흐름에 맞춰 기능의 위치를 재배치하고 나서야 디자인을 얹었고, 그 결과 쇼핑 과정이 한결 수월해졌습니다.',
     '국립민속박물관에서는 먼저 혼재되어 있던 콘텐츠를 사용자가 헤매지 않는 메뉴 구조로 정리하는 일이 우선이었습니다. 방대한 자료를 그 성격에 맞게 어떻게 표출할 것인지, 사용자들이 우선적으로 찾는 자료가 무엇인지에 초점을 두고 설계했습니다. 방문자 연령층에 어린이와 노년층이 폭넓게 포함되어 있다는 점을 고려해, 콘텐츠를 확대하고 구조를 더 단순하게 정리해 누구나 집중해서 찾아볼 수 있도록 했습니다.',
     '두 프로젝트 모두 예쁜 화면보다 사용자가 원하는 곳에 더 빨리 닿는 것을 목표로 삼았고, 리뉴얼 이후 고객 만족도가 눈에 띄게 올라갔습니다.'
   ]},
   {h:'2. 스타트업 — 반복되는 질문과 이탈을 디자인으로 잡다', body:[
     '캠퍼스펀드에서는 업무 특성상 CS, 마케팅, 디자인을 넘나들며 여러 역할을 함께 소화했습니다. 반복적으로 들어오는 문의를 통계로 정리하다 보니 \'P2P 투자가 무엇인가\'라는 질문이 가장 많다는 것을 알게 됐고, 동시에 \'이 회사에 투자해도 되는가\'라는 신뢰성에 대한 문의도 꾸준히 들어온다는 것을 발견했습니다. 이 두 질문에 함께 답할 수 있도록 투자 방식을 설명하고 회사의 성장률을 시각화한 페이지를 만들었습니다.',
     '그 결과 같은 질문의 반복 빈도가 줄었을 뿐 아니라, 문의가 들어와도 그 페이지 링크를 안내하는 것만으로 재질문이 크게 줄었습니다. 사용자가 무엇을 궁금해하는지, 그리고 무엇을 불안해하는지 알아채는 것과, 그것을 이해하기 쉬운 화면으로 옮기는 것, 그리고 그 화면이 실제로 반복되는 대화를 줄여주는 것까지 — 결국 하나로 이어진 과정이었습니다.'
   ]},
   {h:'3. 소규모 비즈니스 — 클라이언트와의 소통으로 최상의 만족도를 제공하다', body:[
     '소규모 비즈니스라고 해서 일이 쉬운 것은 아니었습니다. 오히려 더 까다로운 대화가 오갔습니다. 클라이언트와 일대일로 소통하며 그들이 소비자에게 보여주고 싶은 이미지를 세심하게 파악해야 했고, 사용성을 우선하되 브랜드가 가진 감각과 이미지를 잃지 않아야 했습니다. 소자본 클라이언트일수록 이후의 운영과 관리를 스스로, 편하게 할 수 있기를 원했고, 제한된 예산 안에서 최대의 성과를 내려면 클라이언트가 진짜 원하는 것의 우선순위를 정확히 가려내는 일이 무엇보다 중요했습니다.',
     '밴쿠버의 한식당 전(Jeon)이 그 예입니다. 고급스러운 이미지를 원하시던 클라이언트에게 금색과 짙고 세련된 전통 초록색을 포인트 컬러로 제안했고, 그 색감이 마음에 드셔서 사이트 전체의 톤을 새로 잡게 되었습니다. 색 하나의 미세한 차이가 브랜드의 인상 전체를 바꿀 수 있다는 것을 이 프로젝트에서 다시 확인했습니다.',
     '동시에 고객이 이 사이트에서 가장 원하는 것은 메뉴였습니다. 다운로드해야 하는 번거로움을 없애고 반응형으로 최적화해 큰 카테고리 3개로만 인터랙션을 구성했습니다. 이 메뉴 페이지에는 하루 150명이 넘는 방문자가 접속하고, 구글에서 \'다운타운 한식\'으로 검색했을 때도 상위에 노출됩니다. 인상을 결정하는 색감과 실제로 사용되는 화면의 편의성 — 제한된 예산 안에서 이 둘의 우선순위를 가려낸 결과였습니다.'
   ]},
   {h:'4. 소프트웨어 — 방대한 기능을 정돈된 화면으로', body:[
     '관리자 페이지나 대시보드는 지금까지와는 다른 종류의 문제였습니다. 이 화면을 쓰는 사람은 매일 반복해서 접속하는 내부 사용자였고, 목표는 예쁘게 보이는 것이 아니라 방대한 기능을 인지 부하 없이 빠르게 처리하게 만드는 것이었습니다.',
     '강원랜드 관리자 페이지와 한예종(한국예술종합학교) 학사시스템이 그 예입니다. 기능이 많아질수록 그것들을 하나하나 나열하기보다 큰 카테고리로 묶고, 헷갈리지 않도록 아이콘으로 구분하는 작업이 필요했습니다. 메인 화면에서는 통계와 주요 기능을 한눈에 파악할 수 있어야 했기에, 화려한 장식보다 정보의 위계를 명확히 세우는 데 집중했습니다. 잘 정돈되어 있지만 결코 단순하지는 않은 화면 — 이것이 이 작업들의 목표였습니다.',
     '반복되는 작업일수록 클릭 수를 줄이고, 자주 쓰는 기능일수록 눈에 먼저 띄게 배치하는 것. 사용자를 위한 화면을 만드는 원칙은 이 지점에서도 다르지 않았습니다.'
   ]},
   {h:'결론', body:[
     '공공기관의 방대한 자료든, 스타트업의 반복되는 질문이든, 작은 레스토랑의 메뉴판이든, 매일 쓰는 관리자 화면의 수많은 기능이든 — 규모와 맥락은 매번 달랐지만 제가 하는 일은 한 가지였습니다. 사용자가 무엇을 원하는지 공감하고, 그것을 이해하기 쉬운 형태로 표현하고, 브랜드와 사용자를 연결하는 것.',
     '저는 이 일을 통해 계속 공감하고, 표현하고, 연결하는 사람이 되고 싶습니다.'
   ]}
  ]
 },

   {h:'0. Who I Am', body:[
     'I\'m a designer, and I also act, write, and direct. These might look like separate pursuits, but they share one thing in common — empathizing, expressing, and connecting. The way I try to understand a character\'s emotions on stage isn\'t different from the way I try to understand what a user wants in front of a screen.',

   {h:'1. Public Institutions — Making the Vast Legible at a Glance', body:[
     'The National Museum Foundation\'s online goods shop \'MU:DS\' and the National Folk Museum of Korea\'s main site both started from the same question: how do you take an enormous, scattered archive and let people grasp it at a glance, reaching what they came for, faster.',
     'For MU:DS, I first looked at what people actually clicked on most, where they dropped off, and what errors were showing up in customer-service tickets. The problem was rarely a missing feature — more often, a feature existed but users couldn\'t find it. Only after mapping that usage pattern did I redesign where things lived, which made the shopping experience noticeably smoother.',
     'For the National Folk Museum, the priority was untangling content that had grown scattered over time into a menu structure people wouldn\'t get lost in. I designed around what content mattered most to visitors and how it should be categorized to match its nature — and because the visitor base skews toward both children and older adults, I enlarged key content and simplified the structure so anyone could focus without friction.',

     'Small business work was never the easy option — if anything, the conversations were more demanding. Working one-on-one with a client meant carefully understanding the exact image they wanted to project to their customers, while keeping usability front and center without losing the brand\'s sense of itself. Budget-conscious clients, in particular, wanted to be able to manage and update things themselves afterward — so getting the most out of a limited budget meant correctly identifying what the client actually needed most, and acting on that priority.',
     'Jeon, a Korean restaurant in Vancouver, is the clearest example. The client wanted an elevated, upscale feel, and I proposed gold paired with a deep, refined traditional green as the accent color — a combination that resonated enough that they rebuilt the entire site\'s tone around it. A small difference in color can change a brand\'s whole impression, and this project confirmed that again.',

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let lang = (navigator.language||'ko').startsWith('ko') ? 'ko' : 'en';
let T = I18N[lang];
const found = {cover:false, resume:false, portfolio:false};
const CHAP = {boot:'CH.00 — STANDBY', future:'CH.01 — 2157 / COLLAPSE',
  portal:'CH.02 — TIME JUMP', office:'CH.03 — 2026 / STUDIO',
  terminal:'CH.04 — ACCESS CODE', ending:'CH.05 — RESTORED'};

/* ---------- 사운드 ---------- */
let soundOn = true;

/* 효과음 / 씬별 배경음악 (Howler.js) — CDN 로드 실패해도 조용히 무시되도록 방어 */
const SFX = {};
const BGM = {};        // 트랙 키 -> Howl 인스턴스 (전부 루프)
let currentBgmKey = null;
function initAudio(){
  if (typeof Howl === 'undefined') return;   // CDN 로딩 실패 시 사운드 없이 계속 진행
  const A = CONFIG.audio || {};
  ['click','officeClick','error','complete'].forEach(key=>{
    if (A[key]) SFX[key] = new Howl({ src:[A[key]], volume:.6 });
  });
  ['bgmIntro','bgmFuture','bgmPortal','bgmOffice','bgmTerminal'].forEach(key=>{
    if (A[key]) BGM[key] = new Howl({ src:[A[key]], loop:true, volume:0 });
  });
  Howler.mute(!soundOn);
}
/* CONFIG.audio 에 실제로 걸려 있는 파일들만 모아 출처 표기를 자동 생성 (파일명 = 곡 제목) */
function renderCredits(){
  const el = $('#credits');
  if (!el) return;
  const A = CONFIG.audio || {};
  const seen = new Set(), lines = ['✔ Music provided by 셀바이뮤직'];
  Object.values(A).forEach(src=>{
    if (!src || seen.has(src)) return;
    seen.add(src);
    const name = decodeURIComponent(src.split('/').pop())
      .replace(/\.[^/.]+$/, '')
      .replace(/^SellBuyMusic\s*-\s*/, '').replace(/^-\s*/, '').trim();
    lines.push('🎵 Title : ' + name + ' by SellBuyMusic');
  });
  el.innerHTML = lines.map(l=> '<p>' + l + '</p>').join('');
}
function playSfx(key){ if (SFX[key]) SFX[key].play(); }

/* 씬이 바뀔 때 이전 배경음악은 페이드아웃, 다음 배경음악은 페이드인 — 겹쳐서 자연스럽게 전환 */
function switchBgm(key, fadeMs){
  fadeMs = fadeMs || 1200;
  if (currentBgmKey === key) return;
  const prevKey = currentBgmKey;
  currentBgmKey = key;
  if (prevKey && BGM[prevKey]){
    const prev = BGM[prevKey];
    prev.fade(prev.volume(), 0, fadeMs);
    setTimeout(()=>{ if (currentBgmKey !== prevKey) prev.stop(); }, fadeMs);
  }
  const next = key && BGM[key];
  if (next){
    if (!next.playing()) next.play();
    next.fade(next.volume(), .35, fadeMs);
  }
}
function stopAllBgm(fadeMs){
  const ms = fadeMs || 800;
  currentBgmKey = null;
  Object.values(BGM).forEach(h=>{
    if (h.playing()){ h.fade(h.volume(), 0, ms); setTimeout(()=> h.stop(), ms); }
  });
}

function applyMute(){
  [$('#explodeVid'), $('#travelVid'), $('#restoreVid')].forEach(v=> v.muted = !soundOn);
  if (typeof Howler !== 'undefined') Howler.mute(!soundOn);
  $('#muteBtn').textContent = soundOn ? T.mute : T.unmute;
  $('#muteBtn').setAttribute('aria-pressed', String(!soundOn));
}
$('#muteBtn').onclick = ()=>{ soundOn = !soundOn; applyMute(); };

function resumeUrl(){
  const r = CONFIG.resumeUrl;
  if (typeof r === 'string') return r;
  return (r && (r[lang] || r.en || r.ko)) || '';
}
function applyLang(){
  T = I18N[lang];
  document.documentElement.lang = lang;
  $('#langBtn').textContent = lang === 'ko' ? 'EN' : '한국어';
  $$('[data-i]').forEach(el=>{
    const v = T[el.dataset.i];
    if (typeof v === 'string') el.innerHTML = v;
  });
  $('#boot h1').dataset.text = $('#boot h1').textContent;
  $('#dname').textContent = T.dname;
  $('#lnkPort').href = CONFIG.portfolioUrl;
  $('#lnkRes').href = resumeUrl();
  $('#lnkMail').href = 'mailto:' + CONFIG.email;
  if (scene === 'office') $('#narr').innerHTML = allFound() ? T.narrFound : T.narrArrive;
  if (viewerKey) openViewer(viewerKey, true);
  applyMute();
  updateFsBtn();
}

let scene = 'boot';
function go(id){
  $$('.scene').forEach(s=>s.classList.remove('on'));
  $('#'+id).classList.add('on');
  scene = id;
  $('#chapter').textContent = CHAP[id];
}

/* ---------- 01 intro explosion + dialogue ---------- */
function playExplode(){
  const v = $('#explodeVid');
  const startDialogue = ()=>{
    v.pause(); v.style.display = 'none';
    v.onended = null; v.onerror = null;
    switchBgm('bgmFuture');   // 폭발 이후부터 사이렌 bgm
    di = 0; showLine();
  };
  if (!CONFIG.video.explode){ startDialogue(); return; }
  v.src = CONFIG.video.explode;
  v.loop = false;
  v.style.display = 'block';
  v.onended = startDialogue;
  v.onerror = startDialogue;
  v.play().catch(startDialogue);
}

let di = 0, typing = null;
function showLine(){
  const L = T.lines[di];
  $('#char').classList.remove('on');
  setTimeout(()=>{
    $('#char').src = 'assets/char/sci_'+L.c+'.png';
    $('#char').classList.add('on');
  }, 140);
  if (L.c === 'alert'){ $('#shock').classList.remove('hit'); void $('#shock').offsetWidth; $('#shock').classList.add('hit'); }
  typeOut(L.t);
}
function typeOut(txt){
  clearInterval(typing);
  const el = $('#dtext'); el.textContent = ''; $('#dnext').classList.remove('on');
  let i = 0;
  typing = setInterval(()=>{
    el.textContent = txt.slice(0, ++i);
    if (i >= txt.length){ clearInterval(typing); typing = null; $('#dnext').classList.add('on'); }
  }, 26);
}
$('#dpad').onclick = ()=>{
  playSfx('click');
  if (typing){ clearInterval(typing); typing = null;
    $('#dtext').textContent = T.lines[di].t; $('#dnext').classList.add('on'); return; }
  di++;
  if (di >= T.lines.length) startPortal(); else showLine();
};

/* ---------- 02 portal + travel ---------- */
const cvs = $('#stars'), ctx = cvs.getContext('2d');
let starRAF = null, starsArr = [];
function sizeCanvas(){ cvs.width = cvs.clientWidth; cvs.height = cvs.clientHeight; }
function runStars(){
  cvs.style.display = 'block'; cvs.style.transition = ''; cvs.style.opacity = '1';
  sizeCanvas();
  starsArr = Array.from({length:340},()=>({
    x:(Math.random()-.5)*cvs.width, y:(Math.random()-.5)*cvs.height,
    z:Math.random()*cvs.width, h:Math.random()<.18?'#9aa1a8':'#eef1f4'}));
  const cx = cvs.width/2, cy = cvs.height/2;
  (function loop(){
    ctx.fillStyle = 'rgba(2,4,10,.32)'; ctx.fillRect(0,0,cvs.width,cvs.height);
    starsArr.forEach(s=>{
      s.z -= cvs.width/62;
      if (s.z < 1){ s.z = cvs.width; s.x = (Math.random()-.5)*cvs.width; s.y = (Math.random()-.5)*cvs.height; }
      const k = 128/s.z, x = cx + s.x*k, y = cy + s.y*k;
      const pk = 128/(s.z + cvs.width/62), px = cx + s.x*pk, py = cy + s.y*pk;
      ctx.strokeStyle = s.h; ctx.lineWidth = Math.max(.4, 2.6*(1-s.z/cvs.width));
      ctx.globalAlpha = Math.min(1, 1.15 - s.z/cvs.width);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
    });
    ctx.globalAlpha = 1;
    starRAF = requestAnimationFrame(loop);
  })();
}
/* 블랙홀처럼 별이 중심으로 빨려 들어가는 도입부 (무채색) */
function runSuckIn(durationMs, onDone){
  cvs.style.display = 'block'; cvs.style.transition = ''; cvs.style.opacity = '1';
  sizeCanvas();
  cancelAnimationFrame(starRAF);
  const cx = cvs.width/2, cy = cvs.height/2;
  const maxR = Math.hypot(cvs.width, cvs.height) * .62;
  const parts = Array.from({length:220}, ()=>({
    a: Math.random()*Math.PI*2,
    r0: maxR*(0.32+Math.random()*0.78),
    spin: (Math.random()<.5?-1:1) * (0.6+Math.random()*1.5),
    grey: Math.random()<.2
  }));
  ctx.fillStyle = '#020306'; ctx.fillRect(0,0,cvs.width,cvs.height);
  const t0 = performance.now();
  (function step(now){
    const t = Math.min(1, (now-t0)/durationMs);
    ctx.fillStyle = 'rgba(2,3,6,.4)'; ctx.fillRect(0,0,cvs.width,cvs.height);
    const ease = t*t*t, prevT = Math.max(0, t-0.025), pe = prevT*prevT*prevT;
    parts.forEach(p=>{
      const r = p.r0*(1-ease), ang = p.a + p.spin*ease*3.2;
      const x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r;
      const pr = p.r0*(1-pe), pang = p.a + p.spin*pe*3.2;
      const px = cx + Math.cos(pang)*pr, py = cy + Math.sin(pang)*pr;
      ctx.strokeStyle = p.grey ? 'rgba(154,161,168,'+(.35+ease*.65)+')' : 'rgba(238,241,244,'+(.35+ease*.65)+')';
      ctx.lineWidth = Math.max(.6, 2.4*ease);
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
    });
    if (t < 1) starRAF = requestAnimationFrame(step);
    else onDone && onDone();
  })(t0);
}
/* 포털 이동 공통 로직 — 미래→사무실, 사무실→암호실 양쪽에서 완전히 동일하게 사용
   (링/플래시/블랙홀 흡입 연출/영상 재생 속도·길이가 항상 같도록 한 함수로 묶음) */
function playPortalTravel(onArrive){
  $('#ring').classList.remove('go'); void $('#ring').offsetWidth; $('#ring').classList.add('go');
  $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
  const v = $('#travelVid'), hasVideo = !!CONFIG.video.travel;
  const finish = ()=>{
    cancelAnimationFrame(starRAF);
    v.onended = null; v.pause(); v.style.display = 'none';
    $('#flash').classList.remove('go');
    cvs.style.transition = ''; cvs.style.opacity = ''; cvs.style.display = 'none';
    onArrive();
  };
  if (hasVideo){
    v.src = CONFIG.video.travel; v.style.display = 'block'; v.loop = false;
    v.onended = finish;   // 루프 도중 잘리지 않고 영상이 끝까지 재생된 뒤 자연스럽게 전환
    v.play().catch(()=>{});
  }
  runSuckIn(1100, ()=>{
    if (hasVideo){
      cvs.style.transition = 'opacity .5s ease';
      cvs.style.opacity = '0';
      setTimeout(()=>{ cvs.style.display = 'none'; }, 520);
    } else {
      runStars();
      setTimeout(finish, 4600);
    }
  });
}
function startPortal(){
  go('portal');
  switchBgm('bgmPortal', 1500);
  playPortalTravel(arriveOffice);
}

/* ---------- 03 office / flashlight ---------- */
const stage = $('#stage'), veil = $('#veil'), beam = $('#beamGlow'), hand = $('#hand');
let bx = .5, by = .5, R = 180;
function sizeBeam(){ R = Math.max(110, stage.clientWidth * .155); paintBeam(); }
function paintBeam(){
  const px = bx*stage.clientWidth, py = by*stage.clientHeight;
  [veil, beam].forEach(el=>{
    el.style.setProperty('--x', px+'px');
    el.style.setProperty('--y', py+'px');
    el.style.setProperty('--r', R+'px');
  });
  hand.style.left = (bx*100 - 8) + '%';
  hand.style.transform = 'rotate(' + ((bx-.5)*26).toFixed(1) + 'deg)';
  lightSpots(px, py);
}
const SPOTS = [
  {el:'#sp-cover', key:'cover'},
  {el:'#sp-port',  key:'portfolio'},
  {el:'#sp-res',   key:'resume'}
];
function lightSpots(px, py){
  SPOTS.forEach(s=>{
    const el = $(s.el), r = el.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const cx = r.left - st.left + r.width/2, cy = r.top - st.top + r.height/2;
    const near = Math.hypot(px-cx, py-cy) < R*1.15;
    el.classList.toggle('lit', near || found[s.key]);
    el.classList.toggle('done', found[s.key]);
  });
}
function movePointer(e){
  const st = stage.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  bx = Math.min(1, Math.max(0, (p.clientX - st.left)/st.width));
  by = Math.min(1, Math.max(0, (p.clientY - st.top)/st.height));
  paintBeam();
}
stage.addEventListener('mousemove', e=>{ if (scene==='office' && !$('#viewer').classList.contains('on')) movePointer(e); });
stage.addEventListener('touchmove', e=>{
  if (scene==='office' && !$('#viewer').classList.contains('on')){ movePointer(e); e.preventDefault(); }
}, {passive:false});
stage.addEventListener('touchstart', e=>{ if (scene==='office' && !$('#viewer').classList.contains('on')) movePointer(e); }, {passive:true});
SPOTS.forEach(s=> $(s.el).addEventListener('click', ()=>{ playSfx('officeClick'); openViewer(s.key); }) );

function arriveOffice(){
  go('office'); sizeBeam();
  switchBgm('bgmOffice', 1500);   // 포털 루프와 겹쳐서 자연스럽게 전환
  $('#narr').innerHTML = T.narrArrive;
  setTimeout(()=> $('#narr').classList.add('on'), 700);
}
function allFound(){ return found.cover && found.resume && found.portfolio; }
function markFound(k){
  found[k] = true;
  const idx = {cover:0, resume:1, portfolio:2}[k];
  $('#pip'+idx).classList.add('on');
  paintBeam();
  if (allFound()){
    $('#narr').innerHTML = T.narrFound;
    $('#unlockBtn').classList.add('on');
  }
}
/* 암호실로 갈 때도 portal_space 를 '정방향'으로 재생 — 미래→사무실과 재생 속도·길이가 완전히 동일 */
$('#unlockBtn').onclick = ()=>{
  go('portal');
  switchBgm('bgmPortal', 1500);
  playPortalTravel(()=>{
    switchBgm('bgmTerminal', 1500);
    go('terminal'); $('#in0').focus();
  });
};

/* ---------- viewer ---------- */
let viewerKey = null;
let resumeTab = 'basic';
function renderResumeTab(){
  const r = T.resume, body = $('#resumeBody');
  if (!body) return;
  if (resumeTab === 'career'){
    body.innerHTML = r.jobs.map(j=>`
      <div class="job">
        <div class="jhead"><span class="jtitle">${j.title}</span><span class="jdate">${j.date}</span></div>
        <p class="jorg">${j.org}</p>
        <ul>${j.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>`).join('');
  } else if (resumeTab === 'skills'){
    body.innerHTML = r.skills.map(([k,v])=>`<div class="kv"><b>${k}</b><span>${v}</span></div>`).join('');
  } else {
    body.innerHTML = `<p class="rrole">${r.role}</p><p class="rmeta">${r.meta}</p>
      <div class="rule"></div>
      ${r.contact.map(([k,v])=>`<div class="kv"><b>${k}</b><span>${v}</span></div>`).join('')}
      <p style="margin-top:1.6em">${r.summary}</p>`;
  }
  $$('.rtab').forEach(btn=> btn.classList.toggle('on', btn.dataset.tab === resumeTab));
}
function openViewer(key, silent){
  viewerKey = key;
  const s = $('#sheet');
  if (key === 'cover'){
    const c = T.cover;
    s.innerHTML = `<span class="stamp">${c.stamp}</span><h2>${c.title}</h2>
      <p class="fsubtitle">${c.subtitle}</p>
      <div class="rule"></div>
      ${c.sections.map(sec=>`<div class="fsec"><h3>${sec.h}</h3>${sec.body.map(p=>`<p>${p}</p>`).join('')}</div>`).join('')}`;
  }
  if (key === 'resume'){
    if (!silent) resumeTab = 'basic';
    const r = T.resume;
    s.innerHTML = `<span class="stamp">${r.stamp}</span><h2>${r.title}</h2>
      <div class="rtabs">
        <button class="rtab" data-tab="basic">${r.tabs.basic}</button>
        <button class="rtab" data-tab="career">${r.tabs.career}</button>
        <button class="rtab" data-tab="skills">${r.tabs.skills}</button>
      </div>
      <div class="rule"></div>
      <div id="resumeBody"></div>
      <p style="margin-top:1.6em">${r.note}</p>
      <div class="linkrow"><a class="link" href="${resumeUrl()}" target="_blank" rel="noopener">${r.download}</a></div>`;
    $$('.rtab').forEach(btn=> btn.onclick = ()=>{ resumeTab = btn.dataset.tab; renderResumeTab(); });
    renderResumeTab();
  }
  if (key === 'portfolio'){
    const p = T.port;
    s.innerHTML = `<span class="stamp">${p.stamp}</span><h2>${p.title}</h2>
      <div class="rule"></div>
      <div class="logo"><span class="a">code</span><span class="b">.soomin</span></div>
      <p style="margin-top:1.4em">${p.desc}</p>
      <div class="linkrow"><a class="link" href="${CONFIG.portfolioUrl}" target="_blank" rel="noopener">${p.open} ↗</a></div>`;
  }
  $('#viewer').classList.add('on');
  if (!silent) setTimeout(()=> markFound(key), 900);
}
$('#vclose').onclick = ()=>{ $('#viewer').classList.remove('on'); viewerKey = null; };
$('#viewer').addEventListener('click', e=>{ if (e.target.id === 'viewer') $('#vclose').click(); });

/* ---------- 04 terminal ---------- */
let fails = 0;
function submit(){
  const A = CONFIG.answers;
  const v = [0,1,2].map(i=> $('#in'+i).value.trim().toLowerCase());
  const ok = v[0]===A.cover && v[1]===A.resume && v[2]===A.portfolio;
  if (ok){
    $('#scrMsg').style.color = 'var(--cyan)';
    $('#scrMsg').textContent = T.msgOk;
    [0,1,2].forEach(i=> $('#in'+i).disabled = true);
    setTimeout(()=> $('#deviceLayer').classList.add('off'), 900);   // 컴퓨터 사라짐
    setTimeout(playRestore, 2200);                                   // 복구 영상
  } else {
    playSfx('error');
    fails++;
    $('#screen').classList.remove('err'); void $('#screen').offsetWidth; $('#screen').classList.add('err');
    $('#scrMsg').style.color = 'var(--ember)';
    $('#scrMsg').textContent = T.msgErr + ' (' + fails + ')';
    if (fails >= 2) $('#hintBtn').classList.add('on');
  }
}
$('#runBtn').onclick = submit;
[0,1,2].forEach(i=> $('#in'+i).addEventListener('keydown', e=>{ if (e.key === 'Enter') submit(); }));
$('#hintBtn').onclick = ()=>{ $('#scrMsg').style.color='var(--amber)'; $('#scrMsg').textContent = T.msgHint; };

/* ---------- 05 ending ---------- */
function revealEnd(){
  $('.endwrap').classList.add('on');
  $('#creditsBtn').classList.add('on');
  if (SFX.complete){
    // comedy 스팅어가 완전히 끝난 뒤에만 엔딩 테마가 들어옴 (겹치지 않게)
    SFX.complete.once('end', ()=> switchBgm('bgmOffice', 1200));
    SFX.complete.play();
  } else {
    switchBgm('bgmOffice', 1200);
  }
}

/* 코드 정답 → 복구 영상 재생(끝까지 밝게) → 1초간 정지 이미지 → 어두워지며 텍스트 등장 */
function playRestore(){
  go('ending');
  switchBgm(null, 1200);
  $('#endGrade').classList.remove('on');
  const finish = ()=>{ $('#endGrade').classList.add('on'); revealEnd(); };
  if (!CONFIG.video.restore){ finish(); return; }
  const v = $('#restoreVid');
  v.src = CONFIG.video.restore;
  v.loop = false; v.style.opacity = '1'; v.style.display = 'block';
  v.onended = ()=>{
    v.style.opacity = '0';
    setTimeout(()=>{
      v.style.display = 'none'; v.style.opacity = '1';
      setTimeout(finish, 1000);   // 마지막 이미지를 1초간 밝게 보여준 뒤 어두워짐
    }, 620);
  };
  v.onerror = finish;
  v.play().catch(finish);
  setTimeout(()=>{ if (!$('.endwrap').classList.contains('on')) finish(); }, 20000);
}
/* 건너뛰기 등으로 즉시 엔딩 */
function showEnding(){ go('ending'); $('#endGrade').classList.add('on'); revealEnd(); }
$('#replayBtn').onclick = ()=> location.reload();
$('#creditsBtn').onclick = ()=> $('#credits').classList.toggle('on');
$('#skipBtn').onclick = ()=>{
  clearInterval(typing); cancelAnimationFrame(starRAF); stopAllBgm(400);
  $('#viewer').classList.remove('on');
  showEnding();
};
/* 건너뛰기(엔딩으로 즉시 이동)와 별개 — 지금 씬만 끝내고 바로 다음 씬으로 */
$('#nextBtn').onclick = ()=>{
  $('#viewer').classList.remove('on'); viewerKey = null;
  if (scene === 'boot'){
    $('#startBtn').click();
  } else if (scene === 'future'){
    const v = $('#explodeVid');
    v.pause(); v.style.display = 'none'; v.onended = null; v.onerror = null;
    clearInterval(typing); typing = null;
    startPortal();
  } else if (scene === 'office'){
    ['cover','resume','portfolio'].forEach(k=>{ if (!found[k]) markFound(k); });
    $('#unlockBtn').click();
  } else if (scene === 'terminal'){
    const A = CONFIG.answers;
    $('#in0').value = A.cover; $('#in1').value = A.resume; $('#in2').value = A.portfolio;
    submit();
  }
  // 'portal' / 'ending' 에서는 넘어갈 다음 단계가 따로 없어 아무 동작 없음
};

/* ---------- boot ---------- */
const PRELOAD = ['assets/img/future_ruins.png','assets/img/office_room.png',
  'assets/img/terminal_bg.png','assets/img/hand_light.png',
  'assets/char/sci_alert.png','assets/char/sci_neutral.png','assets/char/sci_scan.png',
  'assets/char/sci_think.png','assets/char/sci_firm.png'];
let loaded = 0;
PRELOAD.forEach(src=>{
  const im = new Image();
  im.onload = im.onerror = ()=>{
    loaded++;
    const pct = Math.round(loaded/PRELOAD.length*100);
    $('#loadTxt').textContent = pct < 100 ? 'CALIBRATING… ' + pct + '%' : 'READY';
  };
  im.src = src;
});
/* computer.png 가 있으면 그것을 쓰고, 없으면 CSS 모니터로 폴백 */
(function initComputer(){
  const C = CONFIG.computer;
  if (!C || !C.src) return;
  const probe = new Image();
  probe.onload = ()=>{
    const im = $('#computerImg'), mon = $('#monitor');
    im.src = C.src;
    Object.assign(im.style, {display:'block',
      left:C.rect.left+'%', top:C.rect.top+'%',
      width:C.rect.width+'%', height:C.rect.height+'%'});
    mon.classList.add('bare');
    Object.assign(mon.style, {
      left:C.screen.left+'%', top:C.screen.top+'%',
      width:C.screen.width+'%', height:C.screen.height+'%'});
  };
  probe.src = C.src;
})();

$('#startBtn').onclick = ()=>{ requestFS(); playSfx('click'); switchBgm(null, 500); go('future'); playExplode(); };
$('#langBtn').onclick = ()=>{ playSfx('click'); lang = lang === 'ko' ? 'en' : 'ko'; applyLang();
  if (scene === 'future') showLine(); };

/* ---------- 전체화면 ---------- */
function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement; }
function requestFS(){
  const el = $('#stage');
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (fn) fn.call(el);
}
function exitFS(){
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (fn) fn.call(document);
}
function updateFsBtn(){
  const btn = $('#fsBtn');
  if (!btn || btn.style.display === 'none') return;
  btn.textContent = fsEl() ? T.exitFullscreen : T.fullscreen;
}
(function initFullscreen(){
  const el = $('#stage');
  const supported = !!(el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen);
  if (!supported) return;
  $('#fsBtn').style.display = '';
  $('#fsBtn').onclick = ()=>{ if (fsEl()) exitFS(); else requestFS(); };
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
    .forEach(ev=> document.addEventListener(ev, updateFsBtn));
})();

addEventListener('resize', ()=>{ sizeBeam(); sizeCanvas(); });
addEventListener('keydown', e=>{ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('dev'); });
applyLang(); sizeBeam(); initAudio(); renderCredits();
switchBgm('bgmIntro', 800);   // 자동재생이 막히면 Howler 가 첫 사용자 입력 시 자동으로 이어서 재생함
</script>
</body>
